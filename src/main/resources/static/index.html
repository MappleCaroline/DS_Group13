
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIND. | Discover More</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #f7f7f4;
            color: #191919;
            font-family: Arial, Helvetica, sans-serif;
        }

        .navbar {
            background: #ffffff;
            border-bottom: 1px solid #e9e9e9;
            padding: 22px 7%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 29px;
            font-weight: 900;
            letter-spacing: -1.5px;
        }

        .logo span {
            color: #f0bc18;
        }

        .nav-text {
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #777777;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            padding: 90px 24px 70px;
        }

        .hero {
            text-align: center;
            margin-bottom: 45px;
        }

        .tag {
            display: inline-block;
            background: #fff0b3;
            color: #6d5200;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 2px;
            padding: 10px 16px;
            border-radius: 30px;
            margin-bottom: 25px;
        }

        h1 {
            font-size: clamp(36px, 6vw, 58px);
            font-weight: 900;
            letter-spacing: -2px;
            line-height: 1.15;
            margin: 0 0 20px;
        }

        h1 span {
            background: #ffd43b;
            padding: 0 8px;
        }

        .subtitle {
            color: #777777;
            font-size: 16px;
            line-height: 1.7;
        }

        .search-box {
            background: #ffffff;
            border: 1px solid #e9e9e9;
            border-radius: 16px;
            padding: 22px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.05);
        }

        #searchForm {
            display: flex;
            gap: 12px;
        }

        #keyword {
            flex: 1;
            min-width: 0;
            padding: 18px 20px;
            border: 2px solid #222222;
            border-radius: 9px;
            font-size: 16px;
            outline: none;
            background: #ffffff;
        }

        #keyword:focus {
            border-color: #e7b800;
        }

        #keyword::placeholder {
            color: #999999;
        }

        button {
            padding: 18px 30px;
            border: none;
            border-radius: 9px;
            background: #ffd43b;
            color: #171717;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        button:hover {
            background: #f2c328;
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.7;
            cursor: wait;
            transform: none;
        }

        .search-hint {
            color: #999999;
            font-size: 12px;
            margin: 14px 2px 0;
        }

        .results-section {
            margin-top: 55px;
        }

        .results-header {
            display: none;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding-bottom: 16px;
            border-bottom: 2px solid #191919;
        }

        .results-header h2 {
            margin: 0;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        #resultCount {
            color: #777777;
            font-size: 12px;
        }

        .result {
            display: flex;
            align-items: flex-start;
            gap: 22px;
            padding: 25px 0;
            border-bottom: 1px solid #e5e5e5;
            animation: fadeIn 0.3s ease;
        }

        .result-number {
            color: #bcbcbc;
            font-size: 25px;
            font-weight: 800;
            min-width: 38px;
        }

        .result-content {
            flex: 1;
            min-width: 0;
        }

        .result a {
            color: #191919;
            font-size: 19px;
            font-weight: 700;
            line-height: 1.5;
            text-decoration: none;
            overflow-wrap: anywhere;
        }

        .result a:hover {
            color: #b58a00;
            text-decoration: underline;
        }

        .result-url {
            color: #888888;
            font-size: 12px;
            margin-top: 9px;
            overflow-wrap: anywhere;
        }

        .result-arrow {
            color: #191919;
            font-size: 22px;
            font-weight: bold;
        }

        .message {
            padding: 35px 20px;
            text-align: center;
            color: #777777;
            background: #ffffff;
            border: 1px solid #e9e9e9;
            border-radius: 12px;
            margin-top: 20px;
            line-height: 1.7;
        }

        .footer {
            margin-top: 70px;
            text-align: center;
            color: #aaaaaa;
            font-size: 12px;
            letter-spacing: 1px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {
            .navbar {
                padding: 18px 20px;
            }

            .nav-text {
                font-size: 9px;
                letter-spacing: 1px;
            }

            .container {
                padding: 60px 18px;
            }

            .hero {
                margin-bottom: 30px;
            }

            #searchForm {
                flex-direction: column;
            }

            button {
                width: 100%;
            }

            .result {
                gap: 12px;
            }

            .result-number {
                font-size: 19px;
                min-width: 30px;
            }

            .result a {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

    <header class="navbar">
        <div class="logo">FIND<span>.</span></div>
        <div class="nav-text">DISCOVER MORE.</div>
    </header>

    <main class="container">

        <section class="hero">
            <div class="tag">YOUR SEARCH STARTS HERE</div>

            <h1>
                What are you<br>
                <span>looking for?</span>
            </h1>

            <p class="subtitle">
                Explore ideas, find answers, and discover<br>
                everything in between.
            </p>
        </section>

        <section class="search-box">
            <form id="searchForm">
                <input
                    type="text"
                    id="keyword"
                    placeholder="Search anything..."
                    aria-label="Search keyword"
                    required
                >

                <button type="submit" id="searchButton">
                    SEARCH →
                </button>
            </form>

            <p class="search-hint">
                Powered by Tavily Search API
            </p>
        </section>

        <section class="results-section">
            <div class="results-header" id="resultsHeader">
                <h2>SEARCH RESULTS</h2>
                <span id="resultCount"></span>
            </div>

            <div id="results" aria-live="polite"></div>
        </section>

        <footer class="footer">
            FIND. — SEARCH. EXPLORE. DISCOVER.
        </footer>

    </main>

    <script>
        const searchForm = document.getElementById("searchForm");
        const keywordInput = document.getElementById("keyword");
        const results = document.getElementById("results");
        const resultsHeader = document.getElementById("resultsHeader");
        const resultCount = document.getElementById("resultCount");
        const searchButton = document.getElementById("searchButton");

        function showMessage(message) {
            results.replaceChildren();

            const box = document.createElement("div");
            box.className = "message";
            box.textContent = message;

            results.appendChild(box);
        }

        searchForm.addEventListener("submit", async function(event) {
            event.preventDefault();

            const keyword = keywordInput.value.trim();

            if (!keyword) {
                return;
            }

            resultsHeader.style.display = "none";
            resultCount.textContent = "";

            showMessage("Searching... Please wait.");

            searchButton.disabled = true;
            searchButton.textContent = "SEARCHING...";

            try {
                const response = await fetch(
                    "/api/search?query=" + encodeURIComponent(keyword)
                );

                if (!response.ok) {
                    throw new Error("Search failed");
                }

                const data = await response.json();

                results.replaceChildren();

                const entries = Object.entries(data);

                if (entries.length === 0) {
                    showMessage(
                        "No results found. Try another keyword!"
                    );
                    return;
                }

                resultsHeader.style.display = "flex";
                resultCount.textContent =
                    entries.length + " RESULTS";

                entries.forEach(function([title, url], index) {
                    const item = document.createElement("div");
                    item.className = "result";

                    const number = document.createElement("div");
                    number.className = "result-number";
                    number.textContent =
                        String(index + 1).padStart(2, "0");

                    const content = document.createElement("div");
                    content.className = "result-content";

                    const link = document.createElement("a");
                    link.href = url;
                    link.target = "_blank";
                    link.rel = "noopener noreferrer";
                    link.textContent = title;

                    const urlText = document.createElement("div");
                    urlText.className = "result-url";
                    urlText.textContent = url;

                    const arrow = document.createElement("div");
                    arrow.className = "result-arrow";
                    arrow.textContent = "↗";

                    content.appendChild(link);
                    content.appendChild(urlText);

                    item.appendChild(number);
                    item.appendChild(content);
                    item.appendChild(arrow);

                    results.appendChild(item);
                });

            } catch (error) {
                showMessage(
                    "Search failed. Please try again later."
                );

            } finally {
                searchButton.disabled = false;
                searchButton.textContent = "SEARCH →";
            }
        });
    </script>

</body>
</html>
